<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Medovik Tower</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1530; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 2 / 3)); width: min(100vw, calc(100dvh * 2 / 3)); height: auto; aspect-ratio: 480 / 720; touch-action: none; display: block; cursor: pointer; }
  #toast {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, -30px); opacity: 0; pointer-events: none;
    width: min(340px, 86vw); box-sizing: border-box; padding: 20px 22px 18px; text-align: center;
    background: #2a1d4a; color: #fff; border: 3px solid #ffd23f; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); transition: opacity .25s, transform .25s; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast h2 { margin: 0 0 6px; font-size: 24px; color: #ffd23f; }
  #toast p { margin: 0 0 14px; font-size: 16px; color: #ffe9b0; }
  #toast p:empty { display: none; }
  #toast .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #toast button {
    font: bold 16px Georgia, serif; padding: 9px 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: #ffd23f; color: #3a2208;
  }
  #toast button:hover { background: #ffe27a; }
  #toast button.alt, button.runaway { background: #4b3a7a; color: #fff; }
  button.runaway {
    position: fixed; z-index: 12; font: bold 16px Georgia, serif; padding: 9px 18px; border-radius: 8px; border: 0;
    cursor: pointer; max-width: 300px; transition: left .16s ease-out, top .16s ease-out;
  }
  .ha {
    position: fixed; z-index: 11; pointer-events: none; font: bold 20px Georgia, serif; color: #ff5d5d;
    text-shadow: 0 2px 0 #000; white-space: nowrap; animation: haFade 1.4s forwards;
  }
  @keyframes haFade { from { opacity: 1; transform: translateY(0) rotate(var(--r)); } to { opacity: 0; transform: translateY(-18px) rotate(var(--r)); } }
  #toast .body { margin: 0 0 14px; max-height: 46vh; overflow: auto; color: #ffe9b0; font-size: 15px; }
  #toast .body:empty { display: none; }
  #toast table { width: 100%; border-collapse: collapse; }
  #toast th { color: #ffd23f; font-size: 13px; }
  #toast th, #toast td { padding: 4px 6px; text-align: left; }
  #toast .r { text-align: right; }
  #toast tr.me td { color: #7dffb0; font-weight: bold; }
  #ui { position: fixed; pointer-events: none; z-index: 5; }
  #ui button, #ui input {
    pointer-events: auto; font: bold 15px Georgia, serif; padding: 9px 16px; border-radius: 8px; border: 2px solid #ffd23f;
    background: #2a1d4a; color: #ffe27a; cursor: pointer; box-sizing: border-box; min-height: 40px;
  }
  #ui input { cursor: text; text-align: center; width: 190px; }
  #ui #pauseBtn {
    position: absolute; right: 3%; top: 7%; min-width: 44px; min-height: 44px; padding: 0; font-size: 22px;
    background: none; border: 0; color: #ffe27a; text-shadow: 0 2px 0 rgba(0,0,0,.7);
  }
  #menuRow { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #menuRow .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast" role="alertdialog"><h2></h2><p></p><div class="body"></div><div class="btns"></div></div>
<div id="ui">
  <button id="pauseBtn" aria-label="Pause">&#10074;&#10074;</button>
  <div id="menuRow">
    <input id="nameIn" maxlength="10" placeholder="Enter your name" autocomplete="off">
    <div class="row"><button id="scoresBtn">High Scores</button><button id="skinBtn"></button></div>
  </div>
</div>
<script src="skins.js"></script>
<script>
(() => {
  const W = 480, H = 720;
  const LAYER = 34;            // height of one cake layer + cream
  const GROUND = H - 70;       // world y of the plate top
  const BASE_W = 220;
  const HOVER_Y = 120;         // screen y where the layer hovers and slides
  const GRAVITY = 5200;
  const CAM_STACK_Y = 420;     // screen y where the top of the stack settles
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // everything a skin needs from the game; t and camY are read live (see skins.js)
  const SK = createSkins({ ctx, W, H, LAYER, GROUND, rnd, rr, mix, get t() { return t; }, get camY() { return camY; } });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    layoutUI();
  }
  function layoutUI() {                                   // HTML buttons sit exactly over the canvas
    const r = canvas.getBoundingClientRect(), s = document.getElementById('ui').style;
    s.left = r.left + 'px'; s.top = r.top + 'px'; s.width = r.width + 'px'; s.height = r.height + 'px';
  }
  addEventListener('resize', resize); resize();

  // ---- audio ----
  let actx = null, muted = false;
  function beep(freq, dur = 0.1, type = 'sine', vol = 0.12, slide = 0) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---- state ----
  let scores = [], playerName = 'PLAYER', lastEntry = null, panelEsc = null, panelOpen = false;
  let skin = 'honey';
  const unlocked = { honey: true };                       // skin id -> unlocked
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  try {
    scores = JSON.parse(localStorage.getItem('medovikScores')) || [];
    playerName = localStorage.getItem('medovikName') || playerName;
    for (const id of SKIN_ORDER) if (SK[id].storeKey) unlocked[id] = localStorage.getItem(SK[id].storeKey) === '1';
    const sv = localStorage.getItem('medovikSkin');
    if (SK[sv] && unlocked[sv]) skin = sv;
  } catch (e) {}
  function unlockSkin(id) { unlocked[id] = true; save(SK[id].storeKey, '1'); }
  if (!Array.isArray(scores)) scores = [];
  const bestPts = () => scores.length ? scores[0].points : 0;
  let state = 'title';         // title | play | over
  const shown = {};
  let speedRandom = false;     // switched on at the 25-layer event
  let testMode = false;        // Konami code: always-perfect drops
  let emergency = false, sirenT = 0, sirenHi = false;   // red alert + shake from 25 layers on
  let blocks, cur, chunks, crumbs, floaters, camY, camTarget, combo, score, perfects, shake, t = 0, overT = 0;
  const ITEM = { x: 12, y: 46, s: 64 };   // item slot on the canvas, top left under the combo text
  let hasItem = false, speedBase = 0, points = 0;   // speed ramps from layer speedBase on

  const rand = (a, b) => a + Math.random() * (b - a);
  function rnd(seed) { const x = Math.sin(seed * 127.1) * 43758.5453; return x - Math.floor(x); }
  const worldTop = i => GROUND - (i + 1) * LAYER;   // world y of layer i's top

  function reset() {
    blocks = [{ x: (W - BASE_W) / 2, w: BASE_W, seed: 1, squash: 0 }];
    chunks = []; crumbs = []; floaters = [];
    shown[15] = shown[20] = shown[24] = shown[25] = false; speedRandom = false; emergency = false;
    camY = 0; combo = 0; score = 0; perfects = 0; shake = 0; hasItem = false; speedBase = 0; points = 0; lastEntry = null;
    updateCamTarget(); camY = camTarget;
    spawn();
  }

  function updateCamTarget() {
    camTarget = Math.max(0, CAM_STACK_Y - GROUND + (blocks.length + 1) * LAYER);
  }

  function peakSpeed(n) { return Math.min(260 + n * 20, 1100); }   // px/sec at centre of the swing

  function spawn() {
    const n = blocks.length, top = blocks[n - 1];
    cur = {
      mode: 'slide', w: top.w, x: 0, seed: n * 7 + 3, age: 0,
      phase: n % 2 ? -Math.PI / 2 : Math.PI / 2, wy: 0, vy: 0,
      hd: n % 2 ? -1 : 1, knifeOff: 0, miss: false,            // hd = side the knife handle is on
      mul: 1, mulT: 1, mulTimer: 0                             // random speed wobble (after 25 layers)
    };
    slideX();
  }

  function slideX() {
    // smooth sine swing across the whole screen
    cur.x = -cur.w / 2 + (W / 2) * (1 + Math.sin(cur.phase));
  }

  function release() {
    const top = blocks[blocks.length - 1];
    if (testMode) cur.x = top.x;                          // test mode: every drop lands perfectly
    const overlap = Math.min(cur.x + cur.w, top.x + top.w) - Math.max(cur.x, top.x);
    cur.wy = HOVER_Y - camY; cur.vy = 0;
    cur.miss = overlap <= 0;
    cur.mode = 'slip';                                    // knife pulls out, layer slides off it
    beep(700, 0.12, 'sine', 0.05, -300);
  }

  function slipOff() {
    if (cur.miss) {                                       // total miss: falls past the stack
      const top = blocks[blocks.length - 1];
      const dir = cur.x + cur.w / 2 < top.x + top.w / 2 ? -1 : 1;
      chunks.push({ x: cur.x, w: cur.w, wy: cur.wy, vy: 0, vx: dir * 90, rot: 0, vr: dir * 1.6, seed: cur.seed });
      beep(260, 0.5, 'sawtooth', 0.12, -200);
      cur = null; gameOver(); return;
    }
    cur.mode = 'fall';
  }

  function burst(x, y, n, spreadX, up, perfect) {
    const cols = SK[skin].crumbs;
    for (let i = 0; i < n; i++) {
      crumbs.push({
        x: x + rand(-spreadX, spreadX), y: y + rand(-3, 1),
        vx: rand(-1, 1) * (80 + Math.abs(rand(-1, 1)) * 140), vy: -rand(40, up),
        s: rand(1.6, 4.2), rot: rand(0, 6), vr: rand(-8, 8), age: 0, life: rand(0.5, 1.1),
        color: perfect ? (Math.random() < 0.6 ? '#ffe27a' : '#fff3d6') : cols[(Math.random() * cols.length) | 0],
        glow: perfect
      });
    }
  }

  function land() {
    const top = blocks[blocks.length - 1];
    const n = blocks.length;
    const y = worldTop(n);
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;
    const contactY = y + LAYER;
    const diff = Math.abs(cur.x - top.x);

    if (diff < 5) {                                       // perfect
      combo++; perfects++;
      const gain = Math.min(100, 30 + 10 * (combo - 1)); points += gain;
      cur.x = top.x;
      if (combo >= 4 && cur.w < BASE_W) cur.w = Math.min(BASE_W, cur.w + 8);
      beep(520 + Math.min(combo, 10) * 55, 0.18, 'triangle');
      floaters.push({ text: (combo > 1 ? 'Perfect x' + combo : 'Perfect!') + ' +' + gain, x: cur.x + cur.w / 2, y: y, age: 0 });
      burst(cur.x + cur.w / 2, contactY, 14, cur.w / 2, 170, true);
      shake = 2;
    } else {
      combo = 0; points += 10;
      if (cur.x < top.x) {                                // overhang on the left
        chunks.push({ x: cur.x, w: top.x - cur.x, wy: y, vy: 0, vx: -45, rot: 0, vr: -1.4, seed: cur.seed });
        burst(top.x, contactY, 10, 6, 220, false);
      } else if (cur.x + cur.w > top.x + top.w) {         // overhang on the right
        const cx = top.x + top.w;
        chunks.push({ x: cx, w: cur.x + cur.w - cx, wy: y, vy: 0, vx: 45, rot: 0, vr: 1.4, seed: cur.seed + 1 });
        burst(cx, contactY, 10, 6, 220, false);
      }
      cur.x = left; cur.w = overlap;
      beep(210, 0.14, 'square', 0.07, -60);
      shake = 4;
    }
    burst(cur.x + cur.w / 2, contactY, 12, cur.w / 2, 120, false);   // landing crumbs every time
    blocks.push({ x: cur.x, w: cur.w, seed: cur.seed, squash: 1 });
    score = blocks.length - 1;
    updateCamTarget();
    spawn();
    if (combo > 0 && combo % 3 === 0 && !hasItem) gift();
    milestone(score);
  }

  function gift() {
    hasItem = true;
    showToast('dayum you is a perfect lil stacker aintcha', 'Here is a gift: Slow-Mo. Tap the item in the top left to reset the knife speed back to the start. It ramps up again from there.', [{ label: 'Thanks', fn: resume }]);
  }

  function useItem() {
    if (!hasItem || state !== 'play') return false;
    hasItem = false; speedBase = blocks.length; speedRandom = false;   // speed (and the wobble) restart from the beginning
    if (cur) cur.mul = cur.mulT = 1;
    floaters.push({ text: 'Speed reset!', x: W / 2, y: HOVER_Y - camY + 70, age: 0 });
    beep(400, 0.3, 'triangle', 0.08, 300);
    return true;
  }

  // ---- toasts (milestones pause the game until dismissed) ----
  const toastEl = document.getElementById('toast');
  function showToast(title, msg, buttons) {
    state = 'toast';
    toastEl.querySelector('h2').textContent = title;
    toastEl.querySelector('p').textContent = msg;
    toastEl.querySelector('.body').innerHTML = ''; panelOpen = false; panelEsc = null;
    clearRunner();
    const box = toastEl.querySelector('.btns'); box.innerHTML = '';
    buttons.forEach((b, i) => {
      const el = document.createElement('button');
      el.textContent = b.label; if (i > 0) el.className = 'alt';
      if (b.run) {                                       // the button that can't be clicked
        runner = el;
        el.addEventListener('pointerdown', e => { e.preventDefault(); flee(e.clientX, e.clientY); });
        el.addEventListener('focus', () => { el.blur(); flee(innerWidth / 2, innerHeight / 2); });
      } else el.onclick = () => { el.blur(); b.fn(); };
      box.appendChild(el);
    });
    toastEl.classList.add('show');
    if (box.firstChild) box.firstChild.focus();
    beep(660, 0.15, 'triangle', 0.08);
  }
  function resume() { toastEl.classList.remove('show'); clearRunner(); state = 'play'; }

  // runaway button with a "HA HA HA" trail
  let runner = null;
  function clearRunner() {
    if (runner) runner.remove();
    runner = null;
    document.querySelectorAll('.ha').forEach(e => e.remove());
  }
  function laugh(x, y) {
    const s = document.createElement('span');
    s.className = 'ha'; s.textContent = 'HA HA HA';
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--r', rand(-20, 20) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }
  function flee(cx, cy) {
    if (!runner) return;
    let r = runner.getBoundingClientRect();
    if (runner.parentNode !== document.body) {           // lift out of the toast so it can roam the whole window
      runner.classList.add('runaway');
      runner.style.left = r.left + 'px'; runner.style.top = r.top + 'px';
      document.body.appendChild(runner);
      r = runner.getBoundingClientRect();
    }
    const bw = r.width, bh = r.height, m = 12;
    let best = null, bestD = -1;
    for (let i = 0; i < 24; i++) {                       // pick the random spot farthest from the cursor
      const x = rand(m, Math.max(m + 1, innerWidth - bw - m)), y = rand(m, Math.max(m + 1, innerHeight - bh - m));
      const d = Math.hypot(x + bw / 2 - cx, y + bh / 2 - cy);
      if (d > bestD) { bestD = d; best = { x, y }; }
    }
    for (let i = 0; i < 6; i++) {                        // trail along the escape path
      const f = i / 5;
      setTimeout(() => laugh(r.left + (best.x - r.left) * f, r.top + (best.y - r.top) * f), i * 25);
    }
    runner.style.left = best.x + 'px'; runner.style.top = best.y + 'px';
    beep(900 + Math.random() * 300, 0.07, 'square', 0.04);
  }
  document.addEventListener('pointermove', e => {
    if (!runner) return;
    const r = runner.getBoundingClientRect(), pad = 70;
    if (e.clientX > r.left - pad && e.clientX < r.right + pad && e.clientY > r.top - pad && e.clientY < r.bottom + pad) flee(e.clientX, e.clientY);
  });
  function closeGame() {
    state = 'closed';
    try { window.close(); } catch (e) {}
    document.body.innerHTML = '<div style="color:#8a82a8;font:20px Georgia,serif;text-align:center">Game closed.</div>';
  }
  function milestone(n) {
    if (n === 15 && !shown[15]) {
      shown[15] = true;
      showToast('Good job!', "15 layers! That's one tall medovik.", [{ label: 'Continue', fn: resume }]);
    } else if (n === 20 && !shown[20]) {
      shown[20] = true;
      showToast("Don't you have a job to do?", '', [
        { label: 'Yes I do', fn: () => { showToast('Nerd.', '', []); setTimeout(closeGame, 1800); } },
        { label: 'Mind ya business', fn: resume }
      ]);
    } else if (n === 24 && !shown[24] && !unlocked.tira) {
      shown[24] = true;
      showToast('Damn broski, maybe you need some coffee', 'Unlock it, then turn it on in Skins.', [
        { label: 'Unlock tiramisu skin', fn: () => { unlockSkin('tira'); beep(660, 0.3, 'triangle', 0.08, 300); resume(); } }
      ]);
    } else if (n === 25 && !shown[25]) {
      shown[25] = true; emergency = true;
      showToast('Is this really a productive use of your time?', '', [
        { label: 'Yes', fn: () => { speedRandom = true; resume(); } },
        { label: "No you're right I should get back to work", run: true }
      ]);
    }
  }

  function gameOver() {
    state = 'over'; overT = 0; lastEntry = null;
    if (!testMode && points > 0) {
      const e = { name: playerName, points, layers: score, perfects, date: Date.now() };
      scores.push(e); scores.sort((a, b) => b.points - a.points); scores = scores.slice(0, 10);
      if (scores.includes(e)) { lastEntry = e; save('medovikScores', JSON.stringify(scores)); }
    }
    nameIn.value = playerName === 'PLAYER' ? '' : playerName;
    if (score === 0 && !unlocked.adam && !testMode) {       // missed the very first layer
      showToast("Wow, you couldn't even land 1 layer. You MUST be AK.", '', [
        { label: 'Unlock Adam(b) person skin', fn: () => { unlockSkin('adam'); closePanel(); state = 'over'; overT = 0; } }
      ]);
    }
  }

  // ---- pause menu, high scores, skins (reuse the toast box) ----
  function openPanel(title, body, buttons, onEsc) {
    toastEl.querySelector('h2').textContent = title;
    toastEl.querySelector('p').textContent = '';
    const b = toastEl.querySelector('.body'); b.innerHTML = ''; if (body) b.appendChild(body);
    clearRunner();
    const box = toastEl.querySelector('.btns'); box.innerHTML = '';
    buttons.forEach((bt, i) => {
      const el = document.createElement('button');
      el.textContent = bt.label; if (i > 0) el.className = 'alt';
      el.onclick = () => { el.blur(); bt.fn(); };
      box.appendChild(el);
    });
    panelOpen = true; panelEsc = onEsc || null;
    toastEl.classList.add('show');
  }
  function closePanel() { toastEl.classList.remove('show'); panelOpen = false; panelEsc = null; }
  function showSkins(back) {
    const body = document.createElement('div');
    const hints = SKIN_ORDER.filter(id => !unlocked[id]).map(id => SK[id].hint);
    body.textContent = hints.length ? hints.join(' ') : 'Pick a skin.';
    const btns = SKIN_ORDER.map(id => ({
      label: SK[id].name + (skin === id ? ' (on)' : !unlocked[id] ? ' (locked)' : ''),
      fn: () => { if (!unlocked[id]) return; skin = id; save('medovikSkin', skin); showSkins(back); }
    }));
    btns.push({ label: 'Back', fn: back });
    openPanel('Skins', body, btns, back);
  }
  function showScores(back) {
    const wrap = document.createElement('div');
    if (!scores.length) wrap.textContent = 'No scores yet. Go stack something!';
    else {
      const tb = document.createElement('table');
      tb.innerHTML = '<tr><th>#</th><th>Name</th><th class="r">Points</th><th class="r">Layers</th></tr>';
      scores.forEach((s, i) => {
        const tr = document.createElement('tr'); if (s === lastEntry) tr.className = 'me';
        [i + 1, s.name, s.points, s.layers].forEach((v, j) => {
          const td = document.createElement('td'); td.textContent = v; if (j > 1) td.className = 'r'; tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      wrap.appendChild(tb);
    }
    openPanel('High Scores', wrap, [{ label: 'Back', fn: back }], back);
  }
  function pause() {
    state = 'paused';
    const btns = [{ label: 'Resume', fn: unpause }, { label: 'High Scores', fn: () => showScores(pause) }];
    btns.push({ label: 'Skins', fn: () => showSkins(pause) });
    btns.push({ label: 'Restart', fn: () => { closePanel(); reset(); state = 'play'; } });
    openPanel('Paused', null, btns, unpause);
  }
  function unpause() { closePanel(); state = 'play'; }

  function press() {
    if (panelOpen) return;
    if (state === 'title') { reset(); state = 'play'; beep(440, 0.1); }
    else if (state === 'play') { if (cur && cur.mode === 'slide') release(); }
    else if (state === 'over' && overT > 0.6) { reset(); state = 'play'; }
  }
  // Konami code (up up down down left right left right B A) toggles test mode
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
  let konamiPos = 0, testToastT = 0;
  addEventListener('keydown', e => {
    if (e.repeat) return;
    konamiPos = e.code === KONAMI[konamiPos] ? konamiPos + 1 : (e.code === KONAMI[0] ? 1 : 0);
    if (konamiPos === KONAMI.length) {
      konamiPos = 0; testMode = !testMode; testToastT = 2;
      beep(testMode ? 880 : 330, 0.25, 'triangle', 0.08);
    }
  });
  addEventListener('keydown', e => {
    if (e.code === 'Escape') { if (!e.repeat) { if (panelEsc) panelEsc(); else if (state === 'play') pause(); } return; }
    if (e.target && e.target.tagName === 'INPUT') { if (e.code === 'Enter') e.target.blur(); return; }   // typing a name
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
    if (e.code === 'KeyM') muted = !muted;
    if (e.code === 'KeyE' && !e.repeat) useItem();
  });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H, m = 8;
    if (hasItem && px >= ITEM.x - m && px <= ITEM.x + ITEM.s + m && py >= ITEM.y - m && py <= ITEM.y + ITEM.s + m) { useItem(); return; }
    press();
  });

  // ---- cake drawing ----
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  // y = top of the layer; the layer is LAYER tall
  function drawLayer(x, w, y, seed, topping) { SK[skin].layer(x, w, y, seed, topping); }
  function drawKnife(c, y) { if (c.knifeOff <= 900) SK[skin].tool(c, y); }   // y = bottom of the layer

  function mix(a, b, p) { return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(',')})`; }

  // the active skin (see skins.js) does the drawing
  function drawBackground() { SK[skin].background(); }

  function text(s, x, y, size, color = '#fff', align = 'center', stroke = 'rgba(0,0,0,.45)') {
    ctx.font = `bold ${size}px Georgia, serif`; ctx.textAlign = align;
    ctx.lineWidth = Math.max(3, size / 8); ctx.strokeStyle = stroke; ctx.lineJoin = 'round';
    ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    if (state === 'closed') return;
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    update(dt); render(); syncUI(); requestAnimationFrame(frame);
  }

  function update(dt) {
    if (state === 'play' && cur) {
      if (cur.mode === 'slide') {
        cur.age += dt;
        if (speedRandom) {
          cur.mulTimer -= dt;
          if (cur.mulTimer <= 0) { cur.mulT = rand(0.5, 1.7); cur.mulTimer = rand(0.25, 0.9); }
          cur.mul += (cur.mulT - cur.mul) * Math.min(1, dt * 8);
        }
        const spd = peakSpeed(blocks.length - speedBase) * cur.mul;
        cur.phase += (spd / (W / 2)) * dt;
        slideX();
      } else if (cur.mode === 'slip') {
        cur.knifeOff += 2800 * dt;
        if (cur.knifeOff > cur.w * 0.45) slipOff();
      } else {
        cur.knifeOff += 2800 * dt;
        cur.vy += GRAVITY * dt;
        cur.wy += cur.vy * dt;
        if (cur.wy >= worldTop(blocks.length)) land();
      }
    }
    if (state === 'over') overT += dt;
    if (emergency && (state === 'play' || state === 'toast')) {      // siren
      sirenT -= dt;
      if (sirenT <= 0) { sirenT = 0.45; sirenHi = !sirenHi; beep(sirenHi ? 880 : 620, 0.4, 'sawtooth', 0.035); }
    }
    camY += (camTarget - camY) * (1 - Math.exp(-dt * 6));
    shake = Math.max(0, shake - dt * 24);
    for (const b of blocks) if (b.squash > 0) b.squash = Math.max(0, b.squash - dt * 4);
    for (const c of chunks) { c.vy += 1800 * dt; c.wy += c.vy * dt; c.x += c.vx * dt; c.rot += c.vr * dt; }
    chunks = chunks.filter(c => c.wy + camY < H + 250);
    for (const c of crumbs) { c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.age += dt; }
    crumbs = crumbs.filter(c => c.age < c.life);
    for (const f of floaters) f.age += dt;
    floaters = floaters.filter(f => f.age < 1);
  }

  function render() {
    const k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.save();
    const sh = shake + (emergency ? 5 : 0);
    if (sh > 0.2) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

    drawBackground();

    const topIdx = blocks.length - 1;
    blocks.forEach((b, i) => {
      const y = worldTop(i) + camY;
      if (y < -LAYER || y > H) return;
      ctx.save();
      if (b.squash > 0) {                                  // little squash-and-settle after landing
        const s = b.squash * b.squash, bottom = y + LAYER, cx = b.x + b.w / 2;
        ctx.translate(cx, bottom); ctx.scale(1 + 0.05 * s, 1 - 0.14 * s); ctx.translate(-cx, -bottom);
      }
      drawLayer(b.x, b.w, y, b.seed, i === topIdx);
      ctx.restore();
    });

    if (cur) {
      if (cur.mode === 'slide') {
        // drop guide
        const top = blocks[topIdx], gyTop = HOVER_Y + LAYER + 6, gyBot = worldTop(blocks.length) + camY;
        ctx.save();
        ctx.setLineDash([5, 7]); ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255,255,255,.28)';
        ctx.beginPath();
        ctx.moveTo(cur.x, gyTop); ctx.lineTo(cur.x, gyBot);
        ctx.moveTo(cur.x + cur.w, gyTop); ctx.lineTo(cur.x + cur.w, gyBot);
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = Math.min(1, cur.age * 6);
        const by = HOVER_Y + Math.sin(t * 3) * 2;
        drawKnife(cur, by + LAYER);
        drawLayer(cur.x, cur.w, by, cur.seed, false);
        ctx.globalAlpha = 1;
      } else {
        const ly = cur.mode === 'slip' ? HOVER_Y : cur.wy + camY;
        drawKnife(cur, HOVER_Y + LAYER);
        drawLayer(cur.x, cur.w, ly, cur.seed, false);
      }
    }

    for (const c of chunks) {
      ctx.save();
      const cx = c.x + c.w / 2, cy = c.wy + camY + LAYER / 2;
      ctx.translate(cx, cy); ctx.rotate(c.rot); ctx.translate(-cx, -cy);
      drawLayer(c.x, c.w, c.wy + camY, c.seed, false);
      ctx.restore();
    }

    for (const c of crumbs) {
      const a = 1 - c.age / c.life;
      ctx.save();
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.translate(c.x, c.y + camY); ctx.rotate(c.rot);
      if (c.glow) { ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 6; }
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s * 0.75);
      ctx.restore();
    }

    for (const f of floaters) {
      const e = 1 - Math.pow(1 - f.age, 3), pop = 1 + 0.3 * Math.max(0, 1 - f.age * 5);
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1 - f.age) * 2);
      ctx.translate(f.x, f.y + camY - 12 - e * 36); ctx.scale(pop, pop);
      text(f.text, 0, 0, 22, '#ffe27a');
      ctx.restore();
    }

    SK[skin].mascot();
    ctx.restore();

    // emergency red light: pulsing wash, vignette and a sweeping beacon beam
    if (emergency && (state === 'play' || state === 'toast')) {
      const p = 0.5 + 0.5 * Math.sin(t * 7);
      ctx.fillStyle = `rgba(255,0,0,${0.08 + 0.14 * p})`; ctx.fillRect(0, 0, W, H);
      const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
      v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, `rgba(255,0,0,${0.35 + 0.35 * p})`);
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(W / 2, -20); ctx.rotate(Math.sin(t * 2.2) * 0.9);
      const beam = ctx.createLinearGradient(0, 0, 0, H * 1.2);
      beam.addColorStop(0, 'rgba(255,60,60,.28)'); beam.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.lineTo(260, H * 1.2); ctx.lineTo(-260, H * 1.2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    if (testMode) text('TEST MODE', 16, H - 14, 14, '#7dffb0', 'left');
    if (testToastT > 0) {
      testToastT -= 1 / 60;
      ctx.globalAlpha = Math.min(1, testToastT * 2);
      text(testMode ? 'Test mode ON' : 'Test mode OFF', W / 2, 110, 24, testMode ? '#7dffb0' : '#ff9a9a');
      ctx.globalAlpha = 1;
    }

    // HUD
    if (state === 'play' || state === 'over') {
      text(String(points), W / 2, 66, 52);
      text('layers ' + score, W / 2, 92, 16, '#ffe9b0');
      text('BEST ' + Math.max(bestPts(), points), W - 16, 34, 18, '#ffe27a', 'right');
      if (state === 'play' && combo > 1) text('combo ' + combo, 16, 34, 18, '#ffe27a', 'left');
      if (hasItem) {
        const { x, y, s } = ITEM, p2 = 0.5 + 0.5 * Math.sin(t * 5);
        ctx.save();
        ctx.font = (46 + p2 * 4) + 'px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
        ctx.fillText('🐌', x + s / 2, y + 48);
        ctx.restore();
      }
    }
    const pulse = 0.65 + 0.35 * Math.sin(t * 4);
    if (state === 'title') {
      ctx.fillStyle = 'rgba(20,10,40,.45)'; ctx.fillRect(0, 0, W, H);
      text('Медовик', W / 2, 230, 64, '#ffd23f');
      text('MEDOVIK TOWER', W / 2, 275, 26, '#fff');
      text('Stack the honey cake as high as you can.', W / 2, 340, 17);
      text('Tap / Space to release the layer', W / 2, 368, 17);
      text('Miss the edge and the cake gets trimmed...', W / 2, 396, 15, '#ffe9b0');
      ctx.globalAlpha = pulse; text('Press Space or tap to start', W / 2, 470, 22, '#ffd23f'); ctx.globalAlpha = 1;
      if (bestPts()) text('Best: ' + bestPts() + ' pts', W / 2, 520, 18);
      ctx.fillStyle = '#0057b7'; ctx.fillRect(0, 0, W, 8);
      ctx.fillStyle = '#ffd700'; ctx.fillRect(0, 8, W, 8);
    }
    if (state === 'over') {
      const a = Math.min(1, overT * 2);
      ctx.fillStyle = `rgba(20,10,40,${0.55 * a})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = a;
      text('Cake collapsed!', W / 2, 250, 42, '#ff8a6b');
      text(points + ' pts', W / 2, 320, 36);
      text(score + ' layers  |  ' + perfects + ' perfect drops', W / 2, 352, 16);
      text(lastEntry && lastEntry === scores[0] ? 'New best!' : lastEntry ? 'Top 10 score!' : 'Best: ' + bestPts(), W / 2, 388, 20, '#ffe27a');
      ctx.globalAlpha = 1;
      if (overT > 0.6) { ctx.globalAlpha = pulse; text('Space or tap to retry', W / 2, 460, 22, '#ffd23f'); ctx.globalAlpha = 1; }
    }
  }

  // ---- HTML buttons over the canvas ----
  const pauseBtn = document.getElementById('pauseBtn'), menuRow = document.getElementById('menuRow');
  const nameIn = document.getElementById('nameIn'), scoresBtn = document.getElementById('scoresBtn'), skinBtn = document.getElementById('skinBtn');
  pauseBtn.onclick = () => { pauseBtn.blur(); if (state === 'play') pause(); };
  scoresBtn.onclick = () => { scoresBtn.blur(); showScores(closePanel); };
  skinBtn.onclick = () => { skinBtn.blur(); showSkins(closePanel); };
  skinBtn.textContent = 'Skins';
  const touchUI = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;   // pause button is for phones only
  nameIn.addEventListener('input', () => {
    playerName = nameIn.value.trim().slice(0, 10) || 'PLAYER'; save('medovikName', playerName);
    if (lastEntry) { lastEntry.name = playerName; save('medovikScores', JSON.stringify(scores)); }
  });
  function syncUI() {
    pauseBtn.style.display = state === 'play' && touchUI ? '' : 'none';
    menuRow.style.display = (state === 'title' || state === 'over') && !panelOpen ? '' : 'none';
    nameIn.style.display = state === 'over' && lastEntry ? '' : 'none';
  }

  reset();
  state = 'title';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
