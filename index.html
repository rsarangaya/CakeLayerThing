<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Medovik Tower</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1530; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 480 / 720; touch-action: none; display: block; cursor: pointer; }
  #toast {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, -30px); opacity: 0; pointer-events: none;
    width: min(340px, 86vw); box-sizing: border-box; padding: 20px 22px 18px; text-align: center;
    background: #2a1d4a; color: #fff; border: 3px solid #ffd23f; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); transition: opacity .25s, transform .25s; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast h2 { margin: 0 0 6px; font-size: 24px; color: #ffd23f; }
  #toast p { margin: 0 0 14px; font-size: 16px; color: #ffe9b0; }
  #toast p:empty { display: none; }
  #toast .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #toast button {
    font: bold 16px Georgia, serif; padding: 9px 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: #ffd23f; color: #3a2208;
  }
  #toast button:hover { background: #ffe27a; }
  #toast button.alt { background: #4b3a7a; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast" role="alertdialog"><h2></h2><p></p><div class="btns"></div></div>
<script>
(() => {
  const W = 480, H = 720;
  const LAYER = 34;            // height of one cake layer + cream
  const GROUND = H - 70;       // world y of the plate top
  const BASE_W = 220;
  const HOVER_Y = 120;         // screen y where the layer hovers and slides
  const GRAVITY = 5200;
  const CAM_STACK_Y = 420;     // screen y where the top of the stack settles
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  addEventListener('resize', resize); resize();

  // ---- audio ----
  let actx = null, muted = false;
  function beep(freq, dur = 0.1, type = 'sine', vol = 0.12, slide = 0) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---- state ----
  let best = 0;
  try { best = +localStorage.getItem('medovikBest') || 0; } catch (e) {}
  let state = 'title';         // title | play | over
  const shown = {};
  let blocks, cur, chunks, crumbs, floaters, camY, camTarget, combo, score, perfects, shake, t = 0, overT = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  function rnd(seed) { const x = Math.sin(seed * 127.1) * 43758.5453; return x - Math.floor(x); }
  const worldTop = i => GROUND - (i + 1) * LAYER;   // world y of layer i's top

  function reset() {
    blocks = [{ x: (W - BASE_W) / 2, w: BASE_W, seed: 1, squash: 0 }];
    chunks = []; crumbs = []; floaters = [];
    shown[15] = shown[20] = false;
    camY = 0; combo = 0; score = 0; perfects = 0; shake = 0;
    updateCamTarget(); camY = camTarget;
    spawn();
  }

  function updateCamTarget() {
    camTarget = Math.max(0, CAM_STACK_Y - GROUND + (blocks.length + 1) * LAYER);
  }

  function peakSpeed(n) { return Math.min(260 + n * 20, 1100); }   // px/sec at centre of the swing

  function spawn() {
    const n = blocks.length, top = blocks[n - 1];
    cur = {
      mode: 'slide', w: top.w, x: 0, seed: n * 7 + 3, age: 0,
      phase: n % 2 ? -Math.PI / 2 : Math.PI / 2, wy: 0, vy: 0,
      hd: n % 2 ? -1 : 1, knifeOff: 0, miss: false             // hd = side the knife handle is on
    };
    slideX();
  }

  function slideX() {
    // smooth sine swing across the whole screen
    cur.x = -cur.w / 2 + (W / 2) * (1 + Math.sin(cur.phase));
  }

  function release() {
    const top = blocks[blocks.length - 1];
    const overlap = Math.min(cur.x + cur.w, top.x + top.w) - Math.max(cur.x, top.x);
    cur.wy = HOVER_Y - camY; cur.vy = 0;
    cur.miss = overlap <= 0;
    cur.mode = 'slip';                                    // knife pulls out, layer slides off it
    beep(700, 0.12, 'sine', 0.05, -300);
  }

  function slipOff() {
    if (cur.miss) {                                       // total miss: falls past the stack
      const top = blocks[blocks.length - 1];
      const dir = cur.x + cur.w / 2 < top.x + top.w / 2 ? -1 : 1;
      chunks.push({ x: cur.x, w: cur.w, wy: cur.wy, vy: 0, vx: dir * 90, rot: 0, vr: dir * 1.6, seed: cur.seed });
      beep(260, 0.5, 'sawtooth', 0.12, -200);
      cur = null; gameOver(); return;
    }
    cur.mode = 'fall';
  }

  function burst(x, y, n, spreadX, up, perfect) {
    const cols = ['#c98a3a', '#a5651f', '#8a4f17', '#e0a850', '#fff3d6', '#f0dba8'];
    for (let i = 0; i < n; i++) {
      crumbs.push({
        x: x + rand(-spreadX, spreadX), y: y + rand(-3, 1),
        vx: rand(-1, 1) * (80 + Math.abs(rand(-1, 1)) * 140), vy: -rand(40, up),
        s: rand(1.6, 4.2), rot: rand(0, 6), vr: rand(-8, 8), age: 0, life: rand(0.5, 1.1),
        color: perfect ? (Math.random() < 0.6 ? '#ffe27a' : '#fff3d6') : cols[(Math.random() * cols.length) | 0],
        glow: perfect
      });
    }
  }

  function land() {
    const top = blocks[blocks.length - 1];
    const n = blocks.length;
    const y = worldTop(n);
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;
    const contactY = y + LAYER;
    const diff = Math.abs(cur.x - top.x);

    if (diff < 5) {                                       // perfect
      combo++; perfects++;
      cur.x = top.x;
      if (combo >= 4 && cur.w < BASE_W) cur.w = Math.min(BASE_W, cur.w + 8);
      beep(520 + Math.min(combo, 10) * 55, 0.18, 'triangle');
      floaters.push({ text: combo > 1 ? 'Perfect x' + combo : 'Perfect!', x: cur.x + cur.w / 2, y: y, age: 0 });
      burst(cur.x + cur.w / 2, contactY, 14, cur.w / 2, 170, true);
      shake = 2;
    } else {
      combo = 0;
      if (cur.x < top.x) {                                // overhang on the left
        chunks.push({ x: cur.x, w: top.x - cur.x, wy: y, vy: 0, vx: -45, rot: 0, vr: -1.4, seed: cur.seed });
        burst(top.x, contactY, 10, 6, 220, false);
      } else if (cur.x + cur.w > top.x + top.w) {         // overhang on the right
        const cx = top.x + top.w;
        chunks.push({ x: cx, w: cur.x + cur.w - cx, wy: y, vy: 0, vx: 45, rot: 0, vr: 1.4, seed: cur.seed + 1 });
        burst(cx, contactY, 10, 6, 220, false);
      }
      cur.x = left; cur.w = overlap;
      beep(210, 0.14, 'square', 0.07, -60);
      shake = 4;
    }
    burst(cur.x + cur.w / 2, contactY, 12, cur.w / 2, 120, false);   // landing crumbs every time
    blocks.push({ x: cur.x, w: cur.w, seed: cur.seed, squash: 1 });
    score = blocks.length - 1;
    updateCamTarget();
    spawn();
    milestone(score);
  }

  // ---- toasts (milestones pause the game until dismissed) ----
  const toastEl = document.getElementById('toast');
  function showToast(title, msg, buttons) {
    state = 'toast';
    toastEl.querySelector('h2').textContent = title;
    toastEl.querySelector('p').textContent = msg;
    const box = toastEl.querySelector('.btns'); box.innerHTML = '';
    buttons.forEach((b, i) => {
      const el = document.createElement('button');
      el.textContent = b.label; if (i > 0) el.className = 'alt';
      el.onclick = () => { el.blur(); b.fn(); };
      box.appendChild(el);
    });
    toastEl.classList.add('show');
    if (box.firstChild) box.firstChild.focus();
    beep(660, 0.15, 'triangle', 0.08);
  }
  function resume() { toastEl.classList.remove('show'); state = 'play'; }
  function closeGame() {
    state = 'closed';
    try { window.close(); } catch (e) {}
    document.body.innerHTML = '<div style="color:#8a82a8;font:20px Georgia,serif;text-align:center">Game closed.</div>';
  }
  function milestone(n) {
    if (n === 15 && !shown[15]) {
      shown[15] = true;
      showToast('Good job!', "15 layers! That's one tall medovik.", [{ label: 'Continue', fn: resume }]);
    } else if (n === 20 && !shown[20]) {
      shown[20] = true;
      showToast("Don't you have a job to do?", '', [
        { label: 'Yes I do', fn: () => { showToast('Nerd.', '', []); setTimeout(closeGame, 1800); } },
        { label: 'Mind ya business', fn: resume }
      ]);
    }
  }

  function gameOver() {
    state = 'over'; overT = 0;
    if (score > best) { best = score; try { localStorage.setItem('medovikBest', best); } catch (e) {} }
  }

  function press() {
    if (state === 'title') { reset(); state = 'play'; beep(440, 0.1); }
    else if (state === 'play') { if (cur && cur.mode === 'slide') release(); }
    else if (state === 'over' && overT > 0.6) { reset(); state = 'play'; }
  }
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
    if (e.code === 'KeyM') muted = !muted;
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });

  // ---- cake drawing ----
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  // y = top of the cream; the layer is LAYER tall
  function drawLayer(x, w, y, seed, topping) {
    const cream = 11, bodyY = y + cream - 3, bodyH = LAYER - cream + 3;
    ctx.save();

    // honey cake body with toasted edges
    rr(x, bodyY, w, bodyH, 4);
    const gx = ctx.createLinearGradient(x, 0, x + w, 0);
    gx.addColorStop(0, '#7d4413'); gx.addColorStop(0.07, '#b06f26'); gx.addColorStop(0.5, '#d09442');
    gx.addColorStop(0.93, '#b06f26'); gx.addColorStop(1, '#7d4413');
    ctx.fillStyle = gx; ctx.fill();
    ctx.save();
    ctx.clip();
    const gy = ctx.createLinearGradient(0, bodyY, 0, bodyY + bodyH);
    gy.addColorStop(0, 'rgba(255,225,150,.12)'); gy.addColorStop(0.55, 'rgba(0,0,0,0)'); gy.addColorStop(1, 'rgba(50,20,0,.4)');
    ctx.fillStyle = gy; ctx.fillRect(x, bodyY, w, bodyH);
    // pores and crumb texture
    const count = Math.max(4, Math.floor(w / 7));
    for (let i = 0; i < count; i++) {
      const px = x + 3 + rnd(seed + i * 1.3) * (w - 6), py = bodyY + 5 + rnd(seed * 3 + i) * (bodyH - 9);
      const s = 0.8 + rnd(seed + i * 5) * 1.6;
      ctx.fillStyle = 'rgba(85,42,8,.5)';
      ctx.beginPath(); ctx.ellipse(px, py, s * 1.3, s * 0.8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,150,.5)';
      ctx.fillRect(px + s, py - s, 1.5, 1);
    }
    // crumbly baked bottom edge
    ctx.fillStyle = 'rgba(70,30,0,.45)'; ctx.fillRect(x, bodyY + bodyH - 3, w, 3);
    for (let i = 0; i < w / 5; i++) {
      ctx.fillStyle = 'rgba(70,30,0,.5)';
      ctx.fillRect(x + i * 5 + rnd(seed + i) * 3, bodyY + bodyH - 4 - rnd(seed + i * 2) * 2, 2, 2);
    }
    ctx.restore();

    // cream shadow on the cake just below
    ctx.fillStyle = 'rgba(60,25,0,.3)'; ctx.fillRect(x + 2, y + cream - 1, w - 4, 3);

    // cream drips
    ctx.fillStyle = '#f6e8c3';
    const drips = Math.max(2, Math.floor(w / 45));
    for (let i = 0; i < drips; i++) {
      const dx = x + 10 + rnd(seed * 2 + i) * (w - 24), dh = 3 + rnd(seed + i * 9) * 4;
      rr(dx, y + cream - 4, 7, dh + 4, 3); ctx.fill();
    }
    // cream layer, slightly bulging past the cake
    rr(x - 2, y, w + 4, cream, 5);
    const gc = ctx.createLinearGradient(0, y, 0, y + cream);
    gc.addColorStop(0, '#fffdf4'); gc.addColorStop(1, '#f1dfb2');
    ctx.fillStyle = gc; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; rr(x + 3, y + 1.5, w - 6, 2, 1); ctx.fill();
    ctx.fillStyle = 'rgba(200,160,90,.35)'; ctx.fillRect(x, y + cream - 2, w, 1.5);

    // crumb topping on the top layer of the cake
    if (topping) {
      const n = Math.floor(w / 3.5);
      for (let i = 0; i < n; i++) {
        const px = x + 1 + rnd(seed * 4 + i * 1.7) * (w - 2), py = y - 1 + rnd(seed + i * 3.1) * 4;
        ctx.fillStyle = ['#b9772a', '#8a4f17', '#d9a257', '#a5651f'][(i + seed) & 3];
        ctx.fillRect(px, py, 2 + rnd(i + seed) * 2, 2 + rnd(i * 2 + seed) * 1.5);
      }
    }
    ctx.restore();
  }

  // cake server / palette knife carrying the layer; y = top of the blade
  function drawKnife(c, y) {
    if (c.knifeOff > 900) return;
    const hd = c.hd, off = c.knifeOff * hd;
    const tip = hd < 0 ? c.x + c.w + 12 : c.x - 12;      // blade tip, far from the handle
    const base = hd < 0 ? c.x - 4 : c.x + c.w + 4;       // where the blade meets the neck
    ctx.save();
    ctx.translate(off, 0);
    // blade
    ctx.beginPath();
    ctx.moveTo(base, y); ctx.lineTo(tip - hd * 8, y);
    ctx.quadraticCurveTo(tip, y + 1, tip, y + 4);
    ctx.quadraticCurveTo(tip - hd * 6, y + 6, tip - hd * 14, y + 5);
    ctx.lineTo(base, y + 5); ctx.closePath();
    const g = ctx.createLinearGradient(0, y, 0, y + 6);
    g.addColorStop(0, '#f4f7fb'); g.addColorStop(1, '#9aa3b3');
    ctx.fillStyle = g; ctx.fill();
    // neck and handle
    const nx = base + hd * 46;
    ctx.strokeStyle = '#aab2c0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(base, y + 2.5); ctx.lineTo(nx, y + 2.5); ctx.stroke();
    const hx = hd > 0 ? nx : nx - 100;
    rr(hx, y - 4, 100, 12, 6);
    const gh = ctx.createLinearGradient(0, y - 4, 0, y + 8);
    gh.addColorStop(0, '#9b5b25'); gh.addColorStop(1, '#5b3213');
    ctx.fillStyle = gh; ctx.fill();
    ctx.fillStyle = '#d7b34a'; ctx.fillRect(hd > 0 ? nx : nx - 6, y - 4, 6, 12);   // brass ferrule
    ctx.restore();
  }

  // ---- other drawing ----
  function drawBee(x, y, tt) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    const fl = Math.sin(tt * 40) * 3;
    ctx.beginPath(); ctx.ellipse(-3, -7, 5, 3 + fl * 0.3, -0.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -7, 5, 3 - fl * 0.3, 0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#f7c21b'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 5.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-2, -5, 2.5, 10); ctx.fillRect(3, -4.5, 2.5, 9);
    ctx.beginPath(); ctx.arc(-8, 0, 3.2, 0, 7); ctx.fill();
    ctx.restore();
  }

  function mix(a, b, p) { return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(',')})`; }

  function drawBackground() {
    const p = Math.min(1, camY / 1800);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mix([58, 80, 160], [12, 10, 40], p));
    g.addColorStop(1, mix([255, 205, 120], [90, 60, 130], p));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + p * 0.8) + ')';
    for (let i = 0; i < 40; i++) {
      const x = rnd(i) * W, y = ((rnd(i + 99) * H * 1.4 + camY * 0.15) % H);
      ctx.fillRect(x, y, 2, 2);
    }
    const gy = GROUND + camY;
    if (gy < H + 100) {
      ctx.fillStyle = '#3d6b2e'; ctx.fillRect(0, gy + 14, W, H);
      for (let i = 0; i < 14; i++) {
        const fx = 20 + i * 36, fy = gy + 14, hh = 8 + rnd(i) * 10;
        ctx.strokeStyle = '#2d5a22'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx, fy + 30); ctx.lineTo(fx, fy - hh + 2); ctx.stroke();
        ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(fx, fy - hh, 9, 0, 7); ctx.fill();
        ctx.fillStyle = '#5a3a14'; ctx.beginPath(); ctx.arc(fx, fy - hh, 4.5, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#e9e6f2'; ctx.fillRect((W - 300) / 2, gy, 300, 8);
      ctx.fillStyle = '#b8b3cf'; ctx.fillRect((W - 300) / 2, gy + 8, 300, 4);
    }
  }

  function text(s, x, y, size, color = '#fff', align = 'center', stroke = 'rgba(0,0,0,.45)') {
    ctx.font = `bold ${size}px Georgia, serif`; ctx.textAlign = align;
    ctx.lineWidth = Math.max(3, size / 8); ctx.strokeStyle = stroke; ctx.lineJoin = 'round';
    ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    if (state === 'closed') return;
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    update(dt); render(); requestAnimationFrame(frame);
  }

  function update(dt) {
    if (state === 'play' && cur) {
      if (cur.mode === 'slide') {
        cur.age += dt;
        cur.phase += (peakSpeed(blocks.length) / (W / 2)) * dt;
        slideX();
      } else if (cur.mode === 'slip') {
        cur.knifeOff += 2800 * dt;
        if (cur.knifeOff > cur.w * 0.45) slipOff();
      } else {
        cur.knifeOff += 2800 * dt;
        cur.vy += GRAVITY * dt;
        cur.wy += cur.vy * dt;
        if (cur.wy >= worldTop(blocks.length)) land();
      }
    }
    if (state === 'over') overT += dt;
    camY += (camTarget - camY) * (1 - Math.exp(-dt * 6));
    shake = Math.max(0, shake - dt * 24);
    for (const b of blocks) if (b.squash > 0) b.squash = Math.max(0, b.squash - dt * 4);
    for (const c of chunks) { c.vy += 1800 * dt; c.wy += c.vy * dt; c.x += c.vx * dt; c.rot += c.vr * dt; }
    chunks = chunks.filter(c => c.wy + camY < H + 250);
    for (const c of crumbs) { c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.age += dt; }
    crumbs = crumbs.filter(c => c.age < c.life);
    for (const f of floaters) f.age += dt;
    floaters = floaters.filter(f => f.age < 1);
  }

  function render() {
    const k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawBackground();

    const topIdx = blocks.length - 1;
    blocks.forEach((b, i) => {
      const y = worldTop(i) + camY;
      if (y < -LAYER || y > H) return;
      ctx.save();
      if (b.squash > 0) {                                  // little squash-and-settle after landing
        const s = b.squash * b.squash, bottom = y + LAYER, cx = b.x + b.w / 2;
        ctx.translate(cx, bottom); ctx.scale(1 + 0.05 * s, 1 - 0.14 * s); ctx.translate(-cx, -bottom);
      }
      drawLayer(b.x, b.w, y, b.seed, i === topIdx);
      ctx.restore();
    });

    if (cur) {
      if (cur.mode === 'slide') {
        // drop guide
        const top = blocks[topIdx], gyTop = HOVER_Y + LAYER + 6, gyBot = worldTop(blocks.length) + camY;
        ctx.save();
        ctx.setLineDash([5, 7]); ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255,255,255,.28)';
        ctx.beginPath();
        ctx.moveTo(cur.x, gyTop); ctx.lineTo(cur.x, gyBot);
        ctx.moveTo(cur.x + cur.w, gyTop); ctx.lineTo(cur.x + cur.w, gyBot);
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = Math.min(1, cur.age * 6);
        const by = HOVER_Y + Math.sin(t * 3) * 2;
        drawKnife(cur, by + LAYER);
        drawLayer(cur.x, cur.w, by, cur.seed, false);
        ctx.globalAlpha = 1;
      } else {
        const ly = cur.mode === 'slip' ? HOVER_Y : cur.wy + camY;
        drawKnife(cur, HOVER_Y + LAYER);
        drawLayer(cur.x, cur.w, ly, cur.seed, false);
      }
    }

    for (const c of chunks) {
      ctx.save();
      const cx = c.x + c.w / 2, cy = c.wy + camY + LAYER / 2;
      ctx.translate(cx, cy); ctx.rotate(c.rot); ctx.translate(-cx, -cy);
      drawLayer(c.x, c.w, c.wy + camY, c.seed, false);
      ctx.restore();
    }

    for (const c of crumbs) {
      const a = 1 - c.age / c.life;
      ctx.save();
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.translate(c.x, c.y + camY); ctx.rotate(c.rot);
      if (c.glow) { ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 6; }
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s * 0.75);
      ctx.restore();
    }

    for (const f of floaters) {
      const e = 1 - Math.pow(1 - f.age, 3), pop = 1 + 0.3 * Math.max(0, 1 - f.age * 5);
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1 - f.age) * 2);
      ctx.translate(f.x, f.y + camY - 12 - e * 36); ctx.scale(pop, pop);
      text(f.text, 0, 0, 22, '#ffe27a');
      ctx.restore();
    }

    drawBee(W / 2 + Math.sin(t * 0.8) * 190, 190 + Math.sin(t * 1.7) * 30 + Math.cos(t * 0.5) * 20, t);
    ctx.restore();

    // HUD
    if (state === 'play' || state === 'over') {
      text(String(score), W / 2, 66, 52);
      text('BEST ' + best, W - 16, 34, 18, '#ffe27a', 'right');
      if (state === 'play' && combo > 1) text('combo ' + combo, 16, 34, 18, '#ffe27a', 'left');
    }
    const pulse = 0.65 + 0.35 * Math.sin(t * 4);
    if (state === 'title') {
      ctx.fillStyle = 'rgba(20,10,40,.45)'; ctx.fillRect(0, 0, W, H);
      text('Медовик', W / 2, 230, 64, '#ffd23f');
      text('MEDOVIK TOWER', W / 2, 275, 26, '#fff');
      text('Stack the honey cake as high as you can.', W / 2, 340, 17);
      text('Tap / Space to release the layer', W / 2, 368, 17);
      text('Miss the edge and the cake gets trimmed...', W / 2, 396, 15, '#ffe9b0');
      ctx.globalAlpha = pulse; text('Press Space or tap to start', W / 2, 470, 22, '#ffd23f'); ctx.globalAlpha = 1;
      if (best) text('Best: ' + best + ' layers', W / 2, 520, 18);
      ctx.fillStyle = '#0057b7'; ctx.fillRect(0, 0, W, 8);
      ctx.fillStyle = '#ffd700'; ctx.fillRect(0, 8, W, 8);
    }
    if (state === 'over') {
      const a = Math.min(1, overT * 2);
      ctx.fillStyle = `rgba(20,10,40,${0.55 * a})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = a;
      text('Cake collapsed!', W / 2, 250, 42, '#ff8a6b');
      text(score + ' layers', W / 2, 320, 36);
      text(score >= best && score > 0 ? 'New best!' : 'Best: ' + best, W / 2, 360, 20, '#ffe27a');
      text('Perfect drops: ' + perfects, W / 2, 392, 16);
      ctx.globalAlpha = 1;
      if (overT > 0.6) { ctx.globalAlpha = pulse; text('Space or tap to retry', W / 2, 460, 22, '#ffd23f'); ctx.globalAlpha = 1; }
    }
  }

  reset();
  state = 'title';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
